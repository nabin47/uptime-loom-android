name: Add Gradle wrapper

# Helper: generates gradlew + gradle/wrapper/* and commits them to the branch
# it runs on, if they're missing (Actions -> Add Gradle wrapper -> Run
# workflow). Also runs when this file changes.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/add-gradle-wrapper.yml"]

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Generate and commit
        run: |
          if [ -f gradlew ]; then echo "Wrapper already present"; exit 0; fi
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git diff --cached --quiet && { echo "Wrapper already present"; exit 0; }
          git commit -m "Add Gradle wrapper (8.13)"
          git push
