name: Android CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["site/**", "**/*.md"]
  pull_request:
    paths-ignore: ["site/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13" # only used to create the wrapper if it's missing

      - name: Gradle wrapper (if missing)
        run: test -f gradlew || gradle wrapper --gradle-version 8.13 --distribution-type bin

      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      # Same build as a release (R8 shrinking, release lint checks), so
      # problems show up before tagging. Signed with the debug key here.
      - name: Release build check
        run: |
          ./gradlew --no-daemon assembleRelease
          ls -l app/build/outputs/apk/release/
          echo "### Release APK sizes" >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/release/*.apk; do
            echo "- $(basename "$f"): $(( $(stat -c %s "$f") / 1024 )) KB" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: uptime-loom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
